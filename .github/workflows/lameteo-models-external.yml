name: Lameteo · Models GFS ICON-EU
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5,17 * * *' 
permissions:
  contents: write
concurrency:
  group: lameteo-models-external
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'requests>=2.32,<3' 'eccodes>=2.38,<3'
      - name: Build model grids
        run: python scripts/lameteo_models_external.py --out data/models
      - name: Commit generated data
        run: |
          git config user.name 'lameteo-models-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A data/models
          if git diff --cached --quiet; then
            echo 'No new data'
          else
            git commit -m 'data: update GFS and ICON-EU interactive grids'
            git pull --rebase origin main
            git push origin main
          fi
