name: ECMWF V4 multi-variable maps

on:
  workflow_dispatch:
  push:
    paths:
      - "models/ecmwf/generate_v4_fields.py"
      - ".github/workflows/ecmwf-v4.yml"
  schedule:
    - cron: "50 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: ecmwf-v4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata eccodes numpy

      - name: Build ECMWF V4 data
        run: python models/ecmwf/generate_v4_fields.py

      - name: Publish V4 data
        run: |
          git config user.name "Lameteo Models Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/models/ecmwf/v4
          if git diff --cached --quiet; then
            echo "No V4 data changes."
            exit 0
          fi
          git commit -m "data: update ECMWF V4 interactive fields"
          git push
