name: ECMWF interactive Catalunya

on:
  workflow_dispatch:
  push:
    paths:
      - "models/ecmwf/**"
      - ".github/workflows/ecmwf-interactive.yml"
  schedule:
    - cron: "35 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: ecmwf-interactive-catalunya
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ecmwf-opendata eccodes numpy shapely

      - name: Fetch official ICGC boundary layers
        continue-on-error: true
        run: python models/ecmwf/download_icgc_boundaries.py

      - name: Build ECMWF interactive grid
        run: python models/ecmwf/generate_temperature_catalunya.py

      - name: Publish latest grid
        run: |
          git config user.name "Lameteo Models Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/models/ecmwf/temperature_2m_catalunya.json
          if [ -d data/cartography ]; then git add data/cartography; fi
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update ECMWF 2m temperature Catalunya"
          git push
